<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulations physique-chimie</title>
<meta name="description" content="Simulations interactives de physique-chimie (Seconde, Quatrième), réalisées par Benjamin Barre.">
<link rel="stylesheet" href="commun/style.css">
<style>
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:28px}
a.level{display:flex;flex-direction:column;gap:.4rem;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:22px 22px 20px;border-top:6px solid var(--c);transition:transform .15s,box-shadow .15s,border-color .15s}
a.level:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(20,30,60,.10)}
.level .big{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--c)}
.level .sub{color:var(--muted);font-weight:600}
.level .n{margin-top:.6rem;font-size:.95rem}
.level .go{margin-top:auto;padding-top:.8rem;font-weight:700;color:var(--accent)}
.level ul{margin:.3rem 0 0;padding-left:1.1rem;color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Simulations de physique-chimie</h1>
    <p>Des animations interactives pour visualiser les notions du cours. Choisis ton niveau.</p>
  </header>
  <nav class="levels" id="levels" aria-label="Choisir un niveau"></nav>
</div>
<footer>
  <span>Réalisé par <strong>Benjamin Barre</strong>, professeur de physique-chimie</span>
  <span>Libre d'utilisation en classe</span>
</footer>
<script src="niveaux.js"></script>
<script src="catalogue.js"></script>
<script>
(() => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const CAT = window.CATALOGUE || [], niveauDe = window.niveauDe || (s => s.niveau || 'seconde');
  document.getElementById('levels').innerHTML = (window.NIVEAUX || []).map(n => {
    const sims = CAT.filter(s => niveauDe(s) === n.id && s.statut === 'en-ligne');
    const themes = n.themes || window.THEMES || [];
    const count = sims.length
      ? `<strong>${sims.length}</strong> simulation${sims.length > 1 ? 's' : ''} disponible${sims.length > 1 ? 's' : ''}`
      : `<span class="badge">Bientôt</span>`;
    return `<a class="level" href="${n.id}/" style="--c:${n.couleur}">
      <span class="big">${esc(n.titre)}</span><span class="sub">${esc(n.sousTitre || '')}</span>
      <span class="n">${count}</span>
      <ul>${themes.map(t => `<li>${esc(t.titre)}</li>`).join('')}</ul>
      <span class="go">Voir les simulations →</span></a>`;
  }).join('');
})();
</script>
</body>
</html>
